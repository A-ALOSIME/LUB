name: LUB checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r services/ai/requirements-test.lock'
      - run: python -m unittest discover -s services/ai -p 'test_*.py' -v
      - run: python -m pip check
      - run: docker build -t lub-web-check .
      - run: docker build -f services/ai/Dockerfile -t lub-ai-check .
