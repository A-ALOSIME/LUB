project_id = "lub"

# Public, read-only source content only. SQL validates visibility, language and
# an atomic shared usage budget; no account or private submission data is accepted.
[functions.translate-content]
verify_jwt = false

# The handler validates JWTs with Supabase Auth before every scoped RPC.
[functions.export-members]
verify_jwt = false

# XLSX generation stays off the free-tier Worker CPU budget; Auth and SQL scope are checked again.
[functions.export-hours]
verify_jwt = false

[functions.export-registrants]
verify_jwt = false

# Stage the direct RPC exporters alongside the old endpoints during cutover.
# Both handlers authenticate the caller with Supabase Auth before querying.
[functions.export-members-v2]
verify_jwt = false
entrypoint = "./functions/export-members/index.ts"
import_map = "./functions/export-members/deno.json"

[functions.export-registrants-v2]
verify_jwt = false
entrypoint = "./functions/export-registrants/index.ts"
import_map = "./functions/export-registrants/deno.json"
